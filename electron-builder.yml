appId: com.joshwright.trenddeck
productName: TrendDeck
directories:
  output: release
  buildResources: resources
# writes resources/shell.json and the app code update next to the installer
afterPack: scripts/after-pack.cjs
files:
  - out/**
  - resources/**
  - package.json
  # ffprobe-static ships every platform's binary, keep only the one we run
  - '!node_modules/ffprobe-static/bin/darwin/**'
  - '!node_modules/ffprobe-static/bin/linux/**'
  - '!node_modules/ffprobe-static/bin/win32/ia32/**'
# the editor spawns ffmpeg and ffprobe, which can't run from inside app.asar
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
win:
  target: nsis
  icon: resources/icon.ico
  artifactName: TrendDeck-Setup.${ext}
# a classic setup wizard: licence, install for me or everyone, pick the folder, progress, finish and launch
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  license: LICENSE
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerSidebar: resources/installer/sidebar.bmp
  uninstallerSidebar: resources/installer/sidebar.bmp
  installerHeader: resources/installer/header.bmp
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TrendDeck
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: TrendDeck
# the app updates itself from the github releases page
publish:
  provider: github
  owner: JoshWright22
  repo: TrendDeck
