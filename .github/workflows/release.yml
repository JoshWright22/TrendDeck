name: release

# push a tag like v0.1.0 to build the windows installer and publish it
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes electron-builder@26 --win --publish never
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/TrendDeck-Setup.exe
            release/TrendDeck-Setup.exe.blockmap
            release/latest.yml
            release/app-update.json
            release/TrendDeck-app-*.asar
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
