name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'The tag must match the package version.'
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This version is already published. Bump the package version before publishing another build.' }
          $global:LASTEXITCODE = 0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm run build
      - run: npx --yes electron-builder@26 --win --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release/TrendDeck-Setup.exe
            release/TrendDeck-Setup.exe.blockmap
            release/latest.yml
            release/app-update.json
            release/TrendDeck-app-*.asar
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
